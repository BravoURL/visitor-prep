<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 April — Visitor Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --sep: rgba(60,60,67,0.1);
  --border: rgba(60,60,67,0.15);
  --text: #000000;
  --text2: #3c3c43;
  --text3: rgba(60,60,67,0.55);
  --text4: rgba(60,60,67,0.35);
  --blue: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  --green: #34c759;
  --purple: #af52de;
  --radius: 12px;
}
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; padding-bottom:80px; }

/* HEADER */
.header { background:rgba(242,242,247,0.94); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); position:sticky; top:0; z-index:50; border-bottom:1px solid var(--sep); }
.header-inner { padding:16px 20px 0; }
.header-title { font-size:26px; font-weight:700; letter-spacing:-0.4px; }
.header-sub { font-size:13px; color:var(--text3); margin-top:2px; margin-bottom:12px; }

/* DASHBOARD CARDS */
.dash-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.dash-card { background:var(--card); border-radius:10px; padding:10px 12px; text-align:center; }
.dash-card-num { font-size:22px; font-weight:700; letter-spacing:-0.5px; line-height:1; }
.dash-card-label { font-size:11px; color:var(--text3); margin-top:3px; font-weight:500; }
.dash-card-num.blue { color:var(--blue); }
.dash-card-num.red { color:var(--red); }
.dash-card-num.purple { color:var(--purple); }
.dash-card-num.teal { color:#0071e3; }
.dash-card-num.green { color:var(--green); }
.dash-card-num.orange { color:var(--orange); }

/* PROGRESS BARS */
.prog-block { margin-bottom:14px; display:flex; flex-direction:column; gap:7px; }
.prog-row { display:flex; align-items:center; gap:8px; }
.prog-label { font-size:12px; color:var(--text3); width:72px; flex-shrink:0; font-weight:500; }
.prog-track { flex:1; height:4px; background:rgba(0,0,0,0.06); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; border-radius:2px; transition:width 0.4s; }
.prog-pct { font-size:12px; font-weight:600; min-width:28px; text-align:right; }

/* CHIPS */
.chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:0 20px 14px; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex-shrink:0; background:var(--card); border:1.5px solid transparent; border-radius:20px; padding:5px 13px; font-size:13px; font-weight:500; color:var(--text2); cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.chip.active { background:var(--blue); color:white; border-color:var(--blue); }
.chip-num { font-weight:700; }

/* TABS */
.tabs { display:flex; gap:4px; padding:0 16px 12px; }
.tab { flex:1; padding:8px 6px; border:none; background:var(--card); font-family:inherit; font-size:13px; font-weight:500; color:var(--text3); cursor:pointer; border-radius:10px; transition:all 0.15s; }
.tab.active { background:var(--blue); color:white; font-weight:600; }

/* MAIN */
.main { padding:0 16px; }

/* SECTION */
.sec { margin-bottom:8px; }
.sec-group { background:var(--card); border-radius:var(--radius); overflow:hidden; }

/* AREA HEADER */
.area-hdr { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; border-bottom:1px solid var(--sep); }
.area-hdr:last-child { border-bottom:none; }
.area-hdr-name { font-size:15px; font-weight:600; }
.area-hdr-right { display:flex; align-items:center; gap:8px; color:var(--text3); font-size:13px; }
.chevron { font-size:16px; color:var(--text4); font-weight:300; line-height:1; transition:transform 0.2s; display:inline-block; }
.chevron.open { transform:rotate(90deg); }

/* TASK ROW */
.task-row { display:flex; align-items:flex-start; gap:12px; padding:11px 16px 11px 50px; border-bottom:1px solid var(--sep); position:relative; }
.task-row:last-child { border-bottom:none; }
.task-row.done { opacity:0.55; }

.chk { position:absolute; left:16px; top:12px; width:22px; height:22px; border-radius:50%; border:2px solid var(--border); background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; flex-shrink:0; }
.chk.on { background:var(--green); border-color:var(--green); }
.chk.on::after { content:''; width:5px; height:9px; border:2px solid white; border-top:none; border-left:none; transform:rotate(45deg) translateY(-1px); display:block; }

.task-body { flex:1; min-width:0; }
.task-name { font-size:15px; font-weight:400; line-height:1.35; margin-bottom:4px; }
.done .task-name { text-decoration:line-through; color:var(--text3); }
.task-meta { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }

.tag { font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; }
.tag.must { background:#fff0ee; color:var(--red); }
.tag.should { background:#fff6e6; color:var(--orange); }
.tag.nice { background:#edfbef; color:var(--green); }
.tag.bj { background:#f5edfc; color:var(--purple); }
.tag.bw { background:#eaf6ff; color:#0071e3; }
.tag.both { background:#f0f0f0; color:#555; }
.tag.trade { background:#f0f0f0; color:#555; }
.tag.donedate { background:none; color:var(--green); font-size:11px; font-weight:500; padding:0; }
.tag.datedue { background:none; color:var(--text3); font-size:11px; font-weight:400; padding:0; }

.task-note { font-size:12px; color:var(--text3); margin-top:3px; line-height:1.4; }
.edit-btn { width:30px; height:30px; border:none; background:transparent; color:var(--text4); cursor:pointer; font-size:20px; font-weight:300; display:flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:6px; margin-top:-2px; line-height:1; }
.edit-btn:active { color:var(--blue); }

/* ADD ROW */
.add-row { padding:10px 4px 4px; display:flex; justify-content:flex-end; }
.add-btn { background:var(--blue); color:white; border:none; border-radius:20px; padding:8px 18px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; }

/* MODAL */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; align-items:flex-end; justify-content:center; }
.overlay.open { display:flex; }
.modal { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; animation:up 0.22s ease; padding-bottom:20px; }
@keyframes up { from{transform:translateY(100%);opacity:0} }
.modal-handle { width:36px; height:4px; background:var(--sep); border-radius:2px; margin:10px auto 0; }
.modal-t { font-size:17px; font-weight:700; text-align:center; padding:16px 20px 12px; }
.modal-body { padding:0 16px; }

.fg { background:var(--bg); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.frow { display:flex; align-items:center; padding:11px 14px; border-bottom:1px solid var(--sep); gap:12px; }
.frow:last-child { border-bottom:none; }
.flabel { font-size:15px; color:var(--text); width:90px; flex-shrink:0; }
.finput,.fselect { flex:1; border:none; background:transparent; font-family:inherit; font-size:15px; color:var(--text); outline:none; text-align:right; -webkit-appearance:none; }
.ftextarea { width:100%; border:none; background:transparent; font-family:inherit; font-size:15px; color:var(--text); outline:none; resize:none; min-height:65px; padding:11px 14px; }
.finput::placeholder { color:var(--text4); text-align:left; }

.modal-actions { padding:6px 16px 0; display:flex; flex-direction:column; gap:8px; }
.btn-save { padding:14px; background:var(--blue); color:white; border:none; border-radius:var(--radius); font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; }
.btn-del { padding:14px; background:#fff0ee; color:var(--red); border:none; border-radius:var(--radius); font-size:16px; font-weight:500; font-family:inherit; cursor:pointer; }
.btn-cancel { padding:14px; background:var(--bg); color:var(--blue); border:none; border-radius:var(--radius); font-size:16px; font-weight:500; font-family:inherit; cursor:pointer; }
.hidden { display:none !important; }
.page { display:none; } .page.active { display:block; }
.empty { text-align:center; padding:50px 20px; color:var(--text3); font-size:15px; }
.sec-label { font-size:12px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; padding:14px 4px 6px; }
.sort-btn { width:36px; height:36px; border:none; background:var(--card); border-radius:10px; font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.sort-btn.active { background:var(--blue); }

@media(min-width:560px){.modal{border-radius:20px;margin-bottom:40px;}.overlay{align-items:center;}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">4 April — Visitor Prep</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div class="header-sub" id="headerSub">Loading…</div><div id="syncStatus" style="font-size:11px;color:var(--text3);font-weight:500;padding-bottom:12px"></div></div>

    <!-- Dashboard cards -->
    <div class="dash-cards">
      <div class="dash-card"><div class="dash-card-num blue" id="dc-total">—</div><div class="dash-card-label">Total</div></div>
      <div class="dash-card"><div class="dash-card-num red" id="dc-must">—</div><div class="dash-card-label">Must Do</div></div>
      <div class="dash-card"><div class="dash-card-num green" id="dc-done">—</div><div class="dash-card-label">Done</div></div>

    </div>

    <!-- Progress bars -->
    <div class="prog-block">
      <div class="prog-row">
        <div class="prog-label">Overall</div>
        <div class="prog-track"><div class="prog-fill" id="pFill-overall" style="width:0%;background:var(--blue)"></div></div>
        <div class="prog-pct" id="pPct-overall" style="color:var(--blue)">0%</div>
      </div>
      <div class="prog-row">
        <div class="prog-label">Indoor</div>
        <div class="prog-track"><div class="prog-fill" id="pFill-indoor" style="width:0%;background:var(--purple)"></div></div>
        <div class="prog-pct" id="pPct-indoor" style="color:var(--purple)">0%</div>
      </div>
      <div class="prog-row">
        <div class="prog-label">Outdoor</div>
        <div class="prog-track"><div class="prog-fill" id="pFill-outdoor" style="width:0%;background:var(--green)"></div></div>
        <div class="prog-pct" id="pPct-outdoor" style="color:var(--green)">0%</div>
      </div>
      <div class="prog-row">
        <div class="prog-label">💜 BJ</div>
        <div class="prog-track"><div class="prog-fill" id="pFill-bj" style="width:0%;background:var(--purple)"></div></div>
        <div class="prog-pct" id="pPct-bj" style="color:var(--purple)">0%</div>
      </div>
      <div class="prog-row">
        <div class="prog-label">💙 BW</div>
        <div class="prog-track"><div class="prog-fill" id="pFill-bw" style="width:0%;background:#0071e3"></div></div>
        <div class="prog-pct" id="pPct-bw" style="color:#0071e3">0%</div>
      </div>
    </div>
  </div>

  <!-- Filter chips -->
  <div class="chips">
    <div class="chip active" onclick="setFilter('all')" id="chip-all">All <span class="chip-num" id="cn-all">—</span></div>
    <div class="chip" onclick="setFilter('must')" id="chip-must">🔴 Must <span class="chip-num" id="cn-must">—</span></div>
    <div class="chip" onclick="setFilter('BJ')" id="chip-BJ">💜 BJ <span class="chip-num" id="cn-BJ">—</span></div>
    <div class="chip" onclick="setFilter('BW')" id="chip-BW">💙 BW <span class="chip-num" id="cn-BW">—</span></div>
    <div class="chip" onclick="setFilter('due-today')" id="chip-due-today">📅 Due Today <span class="chip-num" id="cn-due-today">—</span></div>
    <div class="chip" onclick="setFilter('done')" id="chip-done">✓ Done <span class="chip-num" id="cn-done">—</span></div>
  </div>

  <!-- Sort + Tabs row -->
  <div style="display:flex;gap:4px;padding:0 16px 12px;align-items:center;">
    <div class="tabs" style="flex:1;padding:0;margin:0;">
      <button class="tab active" onclick="switchTab('indoor')" id="tab-indoor">🏠 Indoor</button>
      <button class="tab" onclick="switchTab('outdoor')" id="tab-outdoor">🌿 Outdoor</button>
      <button class="tab" onclick="switchTab('meal')" id="tab-meal">🍽️ Dinner</button>
    </div>
    <button class="sort-btn" id="sortBtn" onclick="toggleSort()" title="Sort by due date">📅</button>
  </div>
</div>

<div class="main">
  <div class="page" id="page-all"></div>
  <div class="page active" id="page-indoor"></div>
  <div class="page" id="page-outdoor"></div>
  <div class="page" id="page-meal"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-t" id="modalT">Task</div>
    <div class="modal-body">
      <div class="fg">
        <div class="frow"><div class="flabel">Task</div><input class="finput" id="fName" placeholder="What needs doing?" style="text-align:left"></div>
        <div class="frow"><div class="flabel">Area</div><select class="fselect" id="fArea"></select></div>
        <div class="frow"><div class="flabel">Section</div><select class="fselect" id="fSection"><option value="Indoor">Indoor</option><option value="Outdoor">Outdoor</option><option value="Meal Prep">Meal Prep</option></select></div>
      </div>
      <div class="fg">
        <div class="frow"><div class="flabel">Priority</div><select class="fselect" id="fPriority"><option value="MUST">Must Do</option><option value="SHOULD">Should Do</option><option value="NICE">Nice to Have</option></select></div>
        <div class="frow"><div class="flabel">Assigned</div><select class="fselect" id="fWho"><option value="BJ">Bernadette</option><option value="BW">Brent</option><option value="Both">Both</option><option value="Painter">Painter</option><option value="Landscaper">Landscaper</option></select></div>
        <div class="frow"><div class="flabel">Due date</div><input type="date" class="finput" id="fDue" min="2026-03-21" max="2026-04-05"></div>
      </div>
      <div class="fg">
        <textarea class="ftextarea" id="fNotes" placeholder="Notes…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveTask()">Save</button>
      <button class="btn-del hidden" id="btnDel" onclick="deleteTask()">Delete Task</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

function showSyncStatus(msg, colour) {
  let el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = colour||'var(--text3)';
}

async function load() {
  showSyncStatus('Loading…');
  try {
    const r = await fetch(BIN_URL+'/latest', {
      headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' }
    });
    if (!r.ok) throw new Error('fetch failed');
    const d = await r.json();
    if (d && d.t && d.t.length) {
      tasks = d.t; nextId = d.id||300; col = d.c||{};
      showSyncStatus('Synced ✓', 'var(--green)');
    } else {
      init();
      await pushToCloud();
    }
  } catch(e) {
    // Fallback to localStorage
    const saved = localStorage.getItem('vp6');
    if (saved) { try { const o=JSON.parse(saved); tasks=o.t; nextId=o.id||300; col=o.c||{}; } catch(e2){init();} }
    else init();
    showSyncStatus('Offline', 'var(--orange)');
  }
}

function init() {
  tasks = SEED.map(t=>({...t, done:false, doneDate:null, due:DEFAULT_DUE, note:''}));
}

async function pushToCloud() {
  if (syncing) return;
  syncing = true;
  showSyncStatus('Saving…');
  const payload = { t:tasks, id:nextId, c:col };
  localStorage.setItem('vp6', JSON.stringify(payload));
  try {
    const r = await fetch(BIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error('put failed');
    showSyncStatus('Saved ✓', 'var(--green)');
    setTimeout(()=>showSyncStatus('', ''), 2000);
  } catch(e) {
    showSyncStatus('Saved locally', 'var(--orange)');
  }
  syncing = false;
}

function persist() {
  // Debounce — wait 800ms after last change before pushing
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 800);
}

    });

}, 15000);

// Cross-section filters that show all sections grouped
const CROSS_FILTERS = ['BJ','BW','due-today','must','done'];

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function setFilter(f) {
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('chip-'+f)?.classList.add('active');
  // For cross-section filters, show the "all" page; otherwise show current tab
  if(CROSS_FILTERS.includes(f)) {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-all').classList.add('active');
    tab='all';
  } else {
    // Reactivate the indoor tab if coming back from cross filter
    if(tab==='all') {
      tab='indoor';
      document.getElementById('tab-indoor').classList.add('active');
    }
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+tab).classList.add('active');
    document.getElementById('tab-'+tab)?.classList.add('active');
  }
  renderAll();
}

function match(t) {
  if(filter==='must') return t.p==='MUST'&&!t.done;
  if(filter==='BJ') return (t.w==='BJ'||t.w==='Both')&&!t.done;
  if(filter==='BW') return (t.w==='BW'||t.w==='Both')&&!t.done;
  if(filter==='done') return t.done;
  if(filter==='due-today') return !t.done && t.due===todayStr();
  return true;
}

function pct(a,b){return b?Math.round(a/b*100):0;}
function setEl(id,val){const e=document.getElementById(id);if(e)e.textContent=val;}
function setW(id,w){const e=document.getElementById(id);if(e)e.style.width=w+'%';}

function updateStats() {
  const total=tasks.length, done=tasks.filter(t=>t.done).length;
  const dl=Math.max(0,Math.ceil((new Date('2026-04-05')-new Date())/86400000));
  setEl('headerSub',`${done} of ${total} done · ${dl} days to go`);

  // Dashboard cards
  setEl('dc-total',total);
  setEl('dc-must',tasks.filter(t=>t.p==='MUST'&&!t.done).length);
  setEl('dc-done',done);
  setEl('dc-bj-rem',tasks.filter(t=>(t.w==='BJ'||t.w==='Both')&&!t.done).length);
  setEl('dc-bw-rem',tasks.filter(t=>(t.w==='BW'||t.w==='Both')&&!t.done).length);
  const tod=todayStr();
  const todCount=tasks.filter(t=>!t.done&&t.due===tod).length;
  setEl('dc-due-today',todCount);

  // Chips
  setEl('cn-all',total);
  setEl('cn-must',tasks.filter(t=>t.p==='MUST'&&!t.done).length);
  setEl('cn-BJ',tasks.filter(t=>(t.w==='BJ'||t.w==='Both')&&!t.done).length);
  setEl('cn-BW',tasks.filter(t=>(t.w==='BW'||t.w==='Both')&&!t.done).length);
  setEl('cn-due-today',todCount);
  setEl('cn-done',done);

  // Progress bars
  const p = n => pct(tasks.filter(t=>t.done&&t.s===n).length, tasks.filter(t=>t.s===n).length);
  const indoorTasks = tasks.filter(t=>t.s==='Indoor');
  const outdoorTasks = tasks.filter(t=>t.s==='Outdoor');
  const bjTasks = tasks.filter(t=>t.w==='BJ'||t.w==='Both');
  const bwTasks = tasks.filter(t=>t.w==='BW'||t.w==='Both');
  const bjDone = tasks.filter(t=>(t.w==='BJ'||t.w==='Both')&&t.done).length;
  const bwDone = tasks.filter(t=>(t.w==='BW'||t.w==='Both')&&t.done).length;

  const overall=pct(done,total);
  setW('pFill-overall',overall); setEl('pPct-overall',overall+'%');
  const ind=pct(indoorTasks.filter(t=>t.done).length,indoorTasks.length);
  setW('pFill-indoor',ind); setEl('pPct-indoor',ind+'%');
  const out=pct(outdoorTasks.filter(t=>t.done).length,outdoorTasks.length);
  setW('pFill-outdoor',out); setEl('pPct-outdoor',out+'%');
  const bj=pct(bjDone,bjTasks.length);
  setW('pFill-bj',bj); setEl('pPct-bj',bj+'%');
  const bw=pct(bwDone,bwTasks.length);
  setW('pFill-bw',bw); setEl('pPct-bw',bw+'%');
}

// Returns tasks sorted by due date if sortByDue, otherwise priority sort
function sortTasks(arr) {
  return [...arr].sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(sortByDue) {
      const da = a.due||'9999', db = b.due||'9999';
      if(da !== db) return da < db ? -1 : 1;
    }
    return {MUST:0,SHOULD:1,NICE:2}[a.p] - {MUST:0,SHOULD:1,NICE:2}[b.p];
  });
}

function renderCrossSection() {
  const container = document.getElementById('page-all');
  const secs = ['Indoor','Outdoor','Meal Prep'];
  const secTab = {Indoor:'indoor',Outdoor:'outdoor','Meal Prep':'meal'};
  const secIcon = {Indoor:'🏠 Indoor',Outdoor:'🌿 Outdoor','Meal Prep':'🍽️ Dinner'};
  let anyContent = false;
  let html = '';

  secs.forEach(sec => {
    const visible = tasks.filter(x=>x.s===sec&&match(x));
    if(!visible.length) return;
    anyContent = true;

    html += `<div class="sec-label">${secIcon[sec]}</div>`;

    const areas={};
    visible.forEach(x=>{if(!areas[x.a])areas[x.a]=[];areas[x.a].push(x);});

    Object.entries(areas).forEach(([area,at])=>{
      const key=sec+'_'+area;
      const open=!col[key];
      const done=at.filter(x=>x.done).length;
      const sorted=sortTasks(at);

      html+=`<div class="sec"><div class="sec-group">
        <div class="area-hdr" onclick="toggleCol('${key}')">
          <div class="area-hdr-name">${area}</div>
          <div class="area-hdr-right"><span>${done}/${at.length}</span><span class="chevron ${open?'open':''}">›</span></div>
        </div>`;

      if(open) sorted.forEach(t=>{
        const note = t.note||t.notes||'';
        const showDue = !t.done && t.due && (t.due!==DEFAULT_DUE || sortByDue);
        html+=`<div class="task-row ${t.done?'done':''}" id="tr-${t.id}">
          <div class="chk ${t.done?'on':''}" onclick="tick(${t.id})"></div>
          <div class="task-body">
            <div class="task-name">${t.n}</div>
            <div class="task-meta">
              ${priTag(t.p)}${whoTag(t.w)}
              ${t.done&&t.doneDate?`<span class="tag donedate">✓ ${fmtDone(t.doneDate)}</span>`:''}
              ${showDue?`<span class="tag datedue">by ${fmtD(t.due)}</span>`:''}
            </div>
            ${note?`<div class="task-note">${note}</div>`:''}
          </div>
          <button class="edit-btn" onclick="openEdit(${t.id})">›</button>
        </div>`;
      });
      html+=`</div></div>`;
    });
  });

  if(!anyContent) html='<div class="empty">Nothing here ✓</div>';
  container.innerHTML=html;
}

function renderPage(t) {
  updateStats();
  const sec = t==='indoor'?'Indoor':t==='outdoor'?'Outdoor':'Meal Prep';
  const pid = 'page-'+t;
  const container = document.getElementById(pid);
  const visible = tasks.filter(x=>x.s===sec&&match(x));
  if(!visible.length){container.innerHTML='<div class="empty">Nothing here ✓</div>';return;}

  const areas={};
  visible.forEach(x=>{if(!areas[x.a])areas[x.a]=[];areas[x.a].push(x);});

  let html=`<div class="add-row"><button class="add-btn" onclick="openAdd('${sec}')">＋ Add</button></div>`;

  Object.entries(areas).forEach(([area,at])=>{
    const key=sec+'_'+area;
    const open=!col[key];
    const done=at.filter(x=>x.done).length;
    const sorted=sortTasks(at);

    html+=`<div class="sec"><div class="sec-group">
      <div class="area-hdr" onclick="toggleCol('${key}')">
        <div class="area-hdr-name">${area}</div>
        <div class="area-hdr-right"><span>${done}/${at.length}</span><span class="chevron ${open?'open':''}">›</span></div>
      </div>`;

    if(open) sorted.forEach(t=>{
      const note = t.note||t.notes||'';
      const showDue = !t.done && t.due && (t.due!==DEFAULT_DUE || sortByDue);
      html+=`<div class="task-row ${t.done?'done':''}" id="tr-${t.id}">
        <div class="chk ${t.done?'on':''}" onclick="tick(${t.id})"></div>
        <div class="task-body">
          <div class="task-name">${t.n}</div>
          <div class="task-meta">
            ${priTag(t.p)}${whoTag(t.w)}
            ${t.done&&t.doneDate?`<span class="tag donedate">✓ ${fmtDone(t.doneDate)}</span>`:''}
            ${showDue?`<span class="tag datedue">by ${fmtD(t.due)}</span>`:''}
          </div>
          ${note?`<div class="task-note">${note}</div>`:''}
        </div>
        <button class="edit-btn" onclick="openEdit(${t.id})">›</button>
      </div>`;
    });
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}

function toggleCol(key) { col[key]=!col[key]; persist(); renderAll(); }

function tick(id) {
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  t.doneDate=t.done?new Date().toISOString():null;
  persist(); renderAll();
}

function allAreas() { return [...new Set(tasks.map(t=>t.a))].sort(); }

function openAdd(sec) {
  editId=null;
  document.getElementById('modalT').textContent='New Task';
  document.getElementById('btnDel').classList.add('hidden');
  document.getElementById('fName').value='';
  document.getElementById('fPriority').value='SHOULD';
  document.getElementById('fWho').value='Both';
  document.getElementById('fDue').value=DEFAULT_DUE;
  document.getElementById('fNotes').value='';
  document.getElementById('fSection').value=sec||'Indoor';
  const sel=document.getElementById('fArea');
  sel.innerHTML=allAreas().map(a=>`<option>${a}</option>`).join('')+'<option value="__new__">+ New area…</option>';
  document.getElementById('overlay').classList.add('open');
}
function openEdit(id) {
  editId=id;
  const t=tasks.find(x=>x.id===id);
  document.getElementById('modalT').textContent='Edit Task';
  document.getElementById('btnDel').classList.remove('hidden');
  document.getElementById('fName').value=t.n;
  document.getElementById('fPriority').value=t.p;
  document.getElementById('fWho').value=t.w;
  document.getElementById('fDue').value=t.due||DEFAULT_DUE;
  document.getElementById('fNotes').value=t.note||t.notes||'';
  document.getElementById('fSection').value=t.s;
  const sel=document.getElementById('fArea');
  sel.innerHTML=allAreas().map(a=>`<option ${a===t.a?'selected':''}>${a}</option>`).join('')+'<option value="__new__">+ New area…</option>';
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function overlayClick(e) { if(e.target===document.getElementById('overlay')) closeModal(); }

function saveTask() {
  const name=document.getElementById('fName').value.trim();
  if(!name) return;
  let area=document.getElementById('fArea').value;
  if(area==='__new__') area=prompt('New area name:')||'General';
  if(editId) {
    const t=tasks.find(x=>x.id===editId);
    t.n=name; t.a=area; t.s=document.getElementById('fSection').value;
    t.p=document.getElementById('fPriority').value; t.w=document.getElementById('fWho').value;
    t.due=document.getElementById('fDue').value||DEFAULT_DUE;
    t.note=document.getElementById('fNotes').value;
  } else {
    tasks.push({id:nextId++,done:false,doneDate:null,n:name,a:area,
      s:document.getElementById('fSection').value,p:document.getElementById('fPriority').value,
      w:document.getElementById('fWho').value,due:document.getElementById('fDue').value||DEFAULT_DUE,
      notes:'',note:document.getElementById('fNotes').value});
  }
  persist(); closeModal(); renderAll();
}
function deleteTask() {
  if(!editId||!confirm('Delete this task?')) return;
  tasks=tasks.filter(x=>x.id!==editId);
  persist(); closeModal(); renderAll();
}

load().then(()=>renderAll());
</script>
